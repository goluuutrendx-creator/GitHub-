<style>
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:#F5EFE4;color:#3A2A20;font-family:Inter,system-ui,sans-serif}
:focus-visible{outline:2px solid #5F6234;outline-offset:2px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.drawer{animation:slide .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(42px)}to{opacity:1;transform:none}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0);transform:translateY(30px)}to{clip-path:inset(-50px);transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes morph{0%,100%{border-radius:48% 52% 45% 55%/55% 45% 55% 45%}50%{border-radius:56% 44% 58% 42%/44% 58% 42% 56%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes marquee{to{transform:translateX(-50%)}}
.hero-line{display:block;overflow:hidden;padding-bottom:.08em}
.hero-line>span{display:block;animation:rise 1s cubic-bezier(.2,.7,.2,1) both}
.fade-up{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.card-m{animation:reveal 1.2s cubic-bezier(.2,.7,.2,1) both,float 7s ease-in-out infinite}
.blob{animation:morph 12s ease-in-out infinite}
.marquee{display:flex;width:max-content;animation:marquee 34s linear infinite}
@media (prefers-reduced-motion:reduce){.hero-line>span,.fade-up,.card-m,.blob,.marquee,.ring{animation:none!important}}
</style>

 shirt:'<path d="M20.4 6.1 16 3a4 4 0 0 1-8 0L3.6 6.1a1 1 0 0 0-.5 1.3l1.2 2.7a1 1 0 0 0 1 .6H7V21h10V10.7h1.7a1 1 0 0 0 1-.6l1.2-2.7a1 1 0 0 0-.5-1.3z"/>',
 mail:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
};
const Icon=({n,className='w-5 h-5',fill})=>(
 <svg viewBox="0 0 24 24" className={className} fill={fill?'currentColor':'none'} stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" dangerouslySetInnerHTML={{__html:PATHS[n]}}/>
);

const Pic=({p})=>p.img
 ? <img src={IMG[p.img]} alt={p.name} loading="lazy" className="w-full h-full object-cover mix-blend-multiply"/>
 : <div className="w-full h-full flex flex-col items-center justify-center gap-2 text-brown/50 bg-sand">
     <Icon n={p.icon} className="w-10 h-10"/><span className="text-xs text-center px-6">Product photo goes here</span>
   </div>;

const Stars=({r,n})=>(
 <div className="flex items-center gap-1 mt-1.5 text-olive" aria-label={`Rated ${r} out of 5`}>
  {[1,2,3,4,5].map(i=><Icon key={i} n="star" fill={i<=Math.round(r)} className="w-3.5 h-3.5"/>)}
  <span className="text-xs text-brown/70 ml-1">{r} ({n})</span>
 </div>
);

const Card=({p,onOpen,onAdd,rating})=>(
 <article className="group">
  <button onClick={()=>onOpen(p)} aria-label={`View ${p.name}`} className="block w-full aspect-[3/4] bg-sand overflow-hidden relative">
   <div className="w-full h-full transition-transform duration-700 group-hover:scale-105"><Pic p={p}/></div>
   {p.isNew&&<span className="absolute top-3 left-3 bg-brown text-cream text-[11px] tracking-wider px-2.5 py-1">New</span>}
  </button>
  <div className="pt-4 flex justify-between gap-3">
   <div>
    <p className="text-xs text-olive">{p.cat}</p>
    <h3 className="font-serif text-xl font-semibold leading-tight mt-0.5">{p.name}</h3>
    {rating&&<Stars r={p.rating} n={p.reviews}/>}
   </div>
   <p className="font-medium whitespace-nowrap">{inr(p.price)}</p>
  </div>
  <button onClick={()=>onAdd(p)} className="mt-3 w-full border border-brown py-2.5 text-xs tracking-[0.18em] hover:bg-brown hover:text-cream transition-colors">ADD TO CART</button>
 </article>
);

const Heading=({title,sub,action})=>(
 <div className="flex flex-wrap items-end justify-between gap-4 mb-10">
  <div><h2 className="font-serif text-4xl sm:text-5xl font-semibold">{title}</h2>{sub&&<p className="mt-2 text-brown/70 max-w-md">{sub}</p>}</div>
  {action}
 </div>
);

function Modal({p,onClose,onAdd}){
 const [size,setSize]=useState('M');
 return(
  <div className="fixed inset-0 z-50 bg-ink/60 flex items-end sm:items-center justify-center sm:p-6" onClick={onClose}>
   <div role="dialog" aria-modal="true" aria-label={p.name} onClick={e=>e.stopPropagation()} className="bg-cream w-full max-w-4xl max-h-[92vh] overflow-auto grid md:grid-cols-2 shadow-soft">
    <div className="aspect-[3/4] md:aspect-auto md:min-h-[460px] bg-sand"><Pic p={p}/></div>
    <div className="p-6 sm:p-10 flex flex-col">
     <button onClick={onClose} aria-label="Close" className="self-end -mt-2 -mr-2 p-2"><Icon n="x"/></button>
     <p className="text-sm text-olive">{p.cat}</p>
     <h3 className="font-serif text-4xl font-semibold mt-1">{p.name}</h3>
     <Stars r={p.rating} n={p.reviews}/>
     <p className="text-2xl mt-4">{inr(p.price)}</p>
     <p className="mt-4 text-brown/80 leading-relaxed">{p.desc}</p>
     <p className="mt-6 text-sm font-medium">Size</p>
     <div className="flex gap-2 mt-2">
      {SIZES.map(s=><button key={s} onClick={()=>setSize(s)} aria-pressed={size===s} className={`w-12 h-12 border transition-colors ${size===s?'bg-brown text-cream border-brown':'border-brown/30 hover:border-brown'}`}>{s}</button>)}
     </div>
     <button onClick={()=>{onAdd(p,size);onClose();}} className="mt-8 bg-brown text-cream py-4 text-sm tracking-[0.18em] hover:bg-ink transition-colors">ADD TO CART</button>
     <p className="mt-4 text-xs text-brown/60">Free returns within 15 days. Complimentary shipping over ₹4,999.</p>
    </div>
   </div>
  </div>
 );
}

function Cart({items,onClose,onQty,onRemove}){
 const [note,setNote]=useState('');
 const subtotal=items.reduce((s,i)=>s+i.p.price*i.qty,0);
 /* Checkout integration point: send `items` to your backend, create an order with your
    payment gateway (e.g. Razorpay, Stripe), then open the gateway's checkout. No payment is processed here. */
 const checkout=()=>setNote('Checkout is not connected yet. Add your payment gateway in the checkout() handler.');
 return(
  <div className="fixed inset-0 z-50 bg-ink/50" onClick={onClose}>
   <aside role="dialog" aria-modal="true" aria-label="Shopping cart" onClick={e=>e.stopPropagation()} className="drawer absolute right-0 top-0 h-full w-full max-w-md bg-cream flex flex-col shadow-soft">
    <div className="flex items-center justify-between p-6 border-b border-brown/10">
     <h2 className="font-serif text-3xl font-semibold">Your cart</h2>
     <button onClick={onClose} aria-label="Close cart" className="p-2"><Icon n="x"/></button>
    </div>
    <div className="flex-1 overflow-auto px-6">
     {items.length===0
      ? <div className="py-20 text-center text-brown/70"><Icon n="bag" className="w-10 h-10 mx-auto mb-4"/><p>Your cart is empty.</p><button onClick={onClose} className="mt-4 underline">Continue shopping</button></div>
      : items.map(({key,p,size,qty})=>(
        <div key={key} className="flex gap-4 py-5 border-b border-brown/10">
         <div className="w-20 h-24 bg-sand shrink-0 overflow-hidden"><Pic p={p}/></div>
         <div className="flex-1 min-w-0">
          <div className="flex justify-between gap-2"><h3 className="font-serif text-lg font-semibold leading-tight">{p.name}</h3><button onClick={()=>onRemove(key)} aria-label={`Remove ${p.name}`} className="text-brown/60 hover:text-brown"><Icon n="trash" className="w-4 h-4"/></button></div>
          <p className="text-xs text-brown/60 mt-0.5">Size {size}</p>
          <div className="flex items-center justify-between mt-3">
           <div className="flex items-center border border-brown/30">
            <button onClick={()=>onQty(key,-1)} aria-label="Decrease quantity" className="p-2"><Icon n="minus" className="w-3.5 h-3.5"/></button>
            <span className="w-8 text-center text-sm" aria-live="polite">{qty}</span>
            <button onClick={()=>onQty(key,1)} aria-label="Increase quantity" className="p-2"><Icon n="plus" className="w-3.5 h-3.5"/></button>
           </div>
           <p className="font-medium">{inr(p.price*qty)}</p>
          </div>
         </div>
        </div>))}
    </div>
    {items.length>0&&<div className="p-6 border-t border-brown/10">
     <div className="flex justify-between text-lg"><span>Subtotal</span><span className="font-semibold">{inr(subtotal)}</span></div>
     <p className="text-xs text-brown/60 mt-1">Shipping and taxes are calculated at checkout.</p>
     <button onClick={checkout} className="mt-4 w-full bg-brown text-cream py-4 text-sm tracking-[0.18em] hover:bg-ink transition-colors">PROCEED TO CHECKOUT</button>
     {note&&<p role="status" className="mt-3 text-xs text-olive">{note}</p>}
    </div>}
   </aside>
  </div>
 );
}

function Newsletter(){
 const [email,setEmail]=useState('');
 const [state,setState]=useState({ok:false,msg:''});
 const submit=e=>{
  e.preventDefault();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email.trim())) return setState({ok:false,msg:'Enter a valid email address, like name@example.com.'});
  setState({ok:true,msg:'You’re on the list. Watch your inbox for the next drop.'}); setEmail('');
 };
 return(
  <section className="py-24 px-5">
   <div className="max-w-2xl mx-auto text-center">
    <h2 className="font-serif text-4xl sm:text-5xl font-semibold">Stay Ahead of the Style.</h2>
    <p className="mt-3 text-brown/70">New arrivals and private offers, once a fortnight.</p>
    <form onSubmit={submit} noValidate className="mt-8 flex flex-col sm:flex-row gap-3">
     <label htmlFor="nl" className="sr-only">Email address</label>
     <input id="nl" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Your email address" aria-invalid={!state.ok&&!!state.msg} className="flex-1 bg-transparent border border-brown/40 px-5 py-4 placeholder:text-brown/50 focus:border-brown outline-none"/>
     <button className="bg-brown text-cream px-8 py-4 text-sm tracking-[0.18em] hover:bg-ink transition-colors">SUBSCRIBE</button>
    </form>
    <p role="status" className={`mt-3 text-sm min-h-[1.25rem] ${state.ok?'text-olive':'text-red-800'}`}>{state.msg}</p>
   </div>
  </section>
 );
}

function App(){
 const [cart,setCart]=useState([]);
 const [cartOpen,setCartOpen]=useState(false);
 const [modal,setModal]=useState(null);
 const [menu,setMenu]=useState(false);
 const [searchOpen,setSearchOpen]=useState(false);
 const [query,setQuery]=useState('');
 const [cat,setCat]=useState('All');

 const add=(p,size='M')=>{
  const key=p.id+'-'+size;
  setCart(c=>c.some(i=>i.key===key)?c.map(i=>i.key===key?{...i,qty:i.qty+1}:i):[...c,{key,id:p.id,size,qty:1}]);
  setCartOpen(true);
 };
 const qty=(key,d)=>setCart(c=>c.map(i=>i.key===key?{...i,qty:Math.max(1,i.qty+d)}:i));
 const remove=key=>setCart(c=>c.filter(i=>i.key!==key));
 const items=cart.map(i=>({...i,p:PRODUCTS.find(p=>p.id===i.id)}));
 const count=cart.reduce((s,i)=>s+i.qty,0);

 useEffect(()=>{
  const h=e=>{if(e.key==='Escape'){setModal(null);setCartOpen(false);setSearchOpen(false);}};
  window.addEventListener('keydown',h);return()=>window.removeEventListener('keydown',h);
 },[]);

 const shown=useMemo(()=>{
  const q=query.trim().toLowerCase();
  return PRODUCTS.filter(p=>(cat==='All'||p.cat===cat)&&(!q||(p.name+' '+p.cat).toLowerCase().includes(q)));
 },[cat,query]);
 const pickCat=c=>{setCat(c);setQuery('');document.getElementById('shop').scrollIntoView();};
 const links=[['Home','#home'],['Shop','#shop'],['New Arrivals','#new'],['Collections','#shop'],['About Us','#about'],['Contact','#contact']];

 return(<>
  <header className="sticky top-0 z-40 bg-cream/95 backdrop-blur border-b border-brown/10" style={{paddingTop:'env(safe-area-inset-top,0px)'}}>
   <div className="max-w-7xl mx-auto px-5 h-20 flex items-center justify-between">
    <a href="#home" className="font-serif text-2xl font-bold tracking-[0.2em]">SATISH<span className="font-normal text-olive"> CLOTHES</span></a>
    <nav className="hidden lg:flex gap-9 text-sm" aria-label="Main">
     {links.map(([l,h])=><a key={l} href={h} className="relative py-1 after:absolute after:left-0 after:-bottom-0.5 after:h-px after:w-0 after:bg-brown hover:after:w-full after:transition-all">{l}</a>)}
    </nav>
    <div className="flex items-center gap-1">
     <button onClick={()=>setSearchOpen(s=>!s)} aria-label="Search" className="p-2.5"><Icon n="search"/></button>
     <button onClick={()=>setCartOpen(true)} aria-label={`Cart, ${count} items`} className="p-2.5 relative"><Icon n="bag"/>{count>0&&<span className="absolute top-0.5 right-0 bg-olive text-cream text-[10px] min-w-[18px] h-[18px] rounded-full grid place-items-center">{count}</span>}</button>
     <button onClick={()=>setMenu(m=>!m)} aria-label="Menu" aria-expanded={menu} className="p-2.5 lg:hidden"><Icon n={menu?'x':'menu'}/></button>
    </div>
   </div>
   {searchOpen&&<form onSubmit={e=>{e.preventDefault();document.getElementById('shop').scrollIntoView();}} className="max-w-7xl mx-auto px-5 pb-4">
    <input autoFocus value={query} onChange={e=>setQuery(e.target.value)} placeholder="Search trousers, shirts, jackets…" aria-label="Search products" className="w-full bg-transparent border-b border-brown/40 py-3 outline-none placeholder:text-brown/50 focus:border-brown"/>
   </form>}
   {menu&&<nav className="lg:hidden px-5 pb-5 flex flex-col" aria-label="Mobile">
    {links.map(([l,h])=><a key={l} href={h} onClick={()=>setMenu(false)} className="py-3 border-t border-brown/10 font-serif text-xl">{l}</a>)}
   </nav>}
  </header>

  <main>
   {/* HERO */}
   <section id="home" className="max-w-7xl mx-auto px-5 py-14 lg:py-20 grid lg:grid-cols-2 gap-12 items-center">
    <div>
     <h1 className="font-serif font-bold text-6xl sm:text-7xl xl:text-8xl leading-[0.95] tracking-tight"><span className="hero-line"><span>SATISH</span></span><span className="hero-line"><span style={{animationDelay:'.12s'}}>CLOTHES</span></span></h1>
     <h2 className="fade-up font-serif text-3xl sm:text-4xl mt-8 text-olive" style={{animationDelay:'.45s'}}>Elevate Your Everyday Style.</h2>
     <p className="fade-up mt-4 text-lg text-brown/80 max-w-md leading-relaxed" style={{animationDelay:'.6s'}}>Discover timeless essentials designed for the modern man.</p>
     <div className="fade-up mt-9 flex flex-col sm:flex-row gap-3" style={{animationDelay:'.75s'}}>
      <a href="#shop" className="bg-brown text-cream px-8 py-4 text-sm tracking-[0.18em] text-center hover:bg-ink transition-colors">SHOP COLLECTION</a>
      <a href="#new" className="border border-brown px-8 py-4 text-sm tracking-[0.18em] text-center hover:bg-brown hover:text-cream transition-colors">EXPLORE NEW ARRIVALS</a>
     </div>
     <p className="fade-up mt-8 font-serif italic text-lg text-brown/70" style={{animationDelay:'.9s'}}>Define Your Style. Own Your Aura.</p>
    </div>
    <div className="relative h-[440px] sm:h-[560px]" aria-hidden="true">
     <div className="blob absolute right-0 top-4 w-[88%] h-[90%] bg-olive/20"/>
     <svg className="ring absolute z-10 left-0 bottom-4 w-28 h-28 sm:w-32 sm:h-32 text-brown" viewBox="0 0 100 100" style={{animation:'spin 18s linear infinite'}}><defs><path id="ringpath" d="M50,50 m-38,0 a38,38 0 1,1 76,0 a38,38 0 1,1 -76,0"/></defs><text fontSize="9.5" fill="currentColor" fontFamily="Inter,sans-serif"><textPath href="#ringpath" textLength="234" lengthAdjust="spacing">NEW SEASON • NEW ARRIVALS • </textPath></text><circle cx="50" cy="50" r="4" fill="#5F6234"/></svg>
     <div className="card-m absolute left-0 top-0 w-[46%] aspect-[3/4] bg-sand shadow-soft overflow-hidden" style={{animationDelay:'.3s,1.8s'}}><img src={IMG.plaid} alt="" className="w-full h-full object-cover mix-blend-multiply"/></div>
     <div className="card-m absolute right-0 top-14 w-[46%] aspect-[3/4] bg-sand shadow-soft overflow-hidden" style={{animationDelay:'.5s,2.4s'}}><img src={IMG.brown} alt="" className="w-full h-full object-cover mix-blend-multiply"/></div>
     <div className="card-m absolute left-[24%] bottom-0 w-[42%] aspect-[3/4] bg-sand shadow-soft overflow-hidden" style={{animationDelay:'.7s,3s'}}><img src={IMG.cream} alt="" className="w-full h-full object-cover mix-blend-multiply"/></div>
    </div>
   </section>

   <div className="bg-brown text-cream py-4 overflow-hidden" aria-hidden="true"><div className="marquee font-serif text-2xl whitespace-nowrap">{[0,1].map(k=><div key={k} className="flex shrink-0">{['New Season','Tailored Trousers','Soft Knits','Everyday Denim','Linen Essentials','Made to Last'].map(t=><span key={t} className="px-8 flex items-center gap-16">{t}<span className="w-1.5 h-1.5 rounded-full bg-olive"/></span>)}</div>)}</div></div>

   {/* NEW ARRIVALS */}
   <section id="new" className="max-w-7xl mx-auto px-5 py-20">
    <Heading title="New Arrivals" sub="Fresh additions in earthy, easy-to-wear tones."/>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-10">
     {PRODUCTS.filter(p=>p.isNew).slice(-4).map(p=><Card key={p.id} p={p} onOpen={setModal} onAdd={add}/>)}
    </div>
   </section>

   {/* SHOP (filters + search) */}
   <section id="shop" className="max-w-7xl mx-auto px-5 py-20">
    <Heading title="The Collection" sub={query?`Showing results for “${query}”`:''} action={query&&<button onClick={()=>setQuery('')} className="underline text-sm">Clear search</button>}/>
    <div className="flex flex-wrap gap-2 mb-10" role="group" aria-label="Filter by category">
     {['All',...CATS].map(c=><button key={c} onClick={()=>setCat(c)} aria-pressed={cat===c} className={`px-5 py-2.5 text-sm border transition-colors ${cat===c?'bg-brown text-cream border-brown':'border-brown/30 hover:border-brown'}`}>{c}</button>)}
    </div>
    {shown.length===0
     ? <p className="py-16 text-center text-brown/70">No pieces match your search. Try another category or clear the search.</p>
     : <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-10">{shown.map(p=><Card key={p.id} p={p} onOpen={setModal} onAdd={add}/>)}</div>}
   </section>

   {/* BEST SELLERS */}
   <section className="max-w-7xl mx-auto px-5 pb-20">
    <Heading title="Best Sellers" sub="The pieces our customers reorder most."/>
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-x-5 gap-y-10">
     {PRODUCTS.filter(p=>p.best).slice(0,4).map(p=><Card key={p.id} p={p} onOpen={setModal} onAdd={add} rating/>)}
    </div>
   </section>

   {/* PROMO */}
   <section className="px-5">
    <div className="max-w-7xl mx-auto bg-brown text-cream relative overflow-hidden px-8 py-20 sm:py-28 text-center">
     <div className="absolute -right-24 -top-24 w-80 h-80 bg-olive/60" style={{borderRadius:'48% 52% 45% 55% / 55% 45% 55% 45%'}} aria-hidden="true"/>
     <div className="relative">
      <h2 className="font-serif text-5xl sm:text-7xl font-semibold">Your Style. Your Statement.</h2>
      <a href="#shop" className="inline-block mt-10 bg-cream text-brown px-10 py-4 text-sm tracking-[0.18em] hover:bg-sand transition-colors">SHOP NOW</a>
     </div>
    </div>
   </section>

   {/* WHY */}
   <section id="about" className="max-w-7xl mx-auto px-5 py-24">
    <Heading title="Why Choose SATISH CLOTHES?" sub="Menswear that is made to be worn often and to last."/>
    <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-10">
     {[['star','Premium Style','Considered silhouettes and a warm, restrained palette that works with everything.'],
       ['shirt','Quality Materials','Wool blends, linen, heavyweight cotton and full-grain leather.'],
       ['bag','Easy Shopping','Clear sizing, simple returns and a cart that stays out of your way.'],
       ['mail','Customer Support','Real people who reply within a day, every day of the week.']].map(([i,t,d])=>(
      <div key={t}><div className="w-12 h-12 rounded-full bg-sand grid place-items-center text-olive"><Icon n={i}/></div>
       <h3 className="font-serif text-2xl font-semibold mt-5">{t}</h3><p className="mt-2 text-brown/70 leading-relaxed">{d}</p></div>))}
    </div>
   </section>

   <div className="bg-sand"><Newsletter/></div>
  </main>

  <footer id="contact" className="bg-ink text-cream/80">
   <div className="max-w-7xl mx-auto px-5 py-16 grid sm:grid-cols-2 lg:grid-cols-4 gap-10">
    <div><p className="font-serif text-2xl font-bold tracking-[0.2em] text-cream">SATISH<span className="font-normal"> CLOTHES</span></p>
     <p className="mt-4 text-sm max-w-xs leading-relaxed">Define Your Style. Own Your Aura.</p>
     <div className="flex gap-4 mt-6">{[['insta','Instagram'],['fb','Facebook'],['xs','X']].map(([i,l])=><a key={l} href="#contact" aria-label={l} className="hover:text-cream"><Icon n={i}/></a>)}</div></div>
    <div><h3 className="font-serif text-xl text-cream mb-4">Quick Links</h3><ul className="space-y-2 text-sm">{links.slice(0,5).map(([l,h])=><li key={l}><a href={h} className="hover:text-cream">{l}</a></li>)}</ul></div>
    <div><h3 className="font-serif text-xl text-cream mb-4">Customer Support</h3><ul className="space-y-2 text-sm">{['Shipping & Delivery','Returns & Exchanges','Size Guide','Track Order','FAQs'].map(l=><li key={l}><a href="#contact" className="hover:text-cream">{l}</a></li>)}</ul></div>
    <div><h3 className="font-serif text-xl text-cream mb-4">Contact</h3><p className="text-sm leading-relaxed">hello@satishclothes.example<br/>Mon–Sat, 10 am – 7 pm IST</p></div>
   </div>
   <p className="border-t border-cream/10 text-center text-xs py-6">© 2026 SATISH CLOTHES. All rights reserved.</p>
  </footer>

  {modal&&<Modal p={modal} onClose={()=>setModal(null)} onAdd={add}/>}
  {cartOpen&&<Cart items={items} onClose={()=>setCartOpen(false)} onQty={qty} onRemove={remove}/>}
 </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
